name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button on the Actions tab, to republish after pushing the 3d branch

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The 3D version lives on the 3d branch and is published at /3d/
      - uses: actions/checkout@v4
        with:
          ref: 3d
          path: 3d
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
