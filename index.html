<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nakatomi Snake</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at top, #1d2a44, #05070d 70%); color: #eee; font-family: system-ui, sans-serif; }
  h1 { margin: 0; font-family: Impact, 'Arial Narrow Bold', sans-serif; font-size: 48px; letter-spacing: 4px; color: #f0f0f0; text-shadow: 0 0 12px #ff3b1f, 3px 3px 0 #8a0000; }
  .sub { margin: 4px 0 14px; color: #c9a227; letter-spacing: 3px; text-transform: uppercase; font-size: 13px; }
  #score { font-family: Impact, sans-serif; font-size: 22px; letter-spacing: 1px; margin-bottom: 10px; color: #ffd24a; }
  canvas { display: block; }
  #sky { position: fixed; inset: 0; z-index: -1; }
  #game { position: relative; }
  #msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; font-size: 18px; text-shadow: 0 0 6px #000; }
  #msg b { font: 48px Impact, sans-serif; color: #ff3b1f; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<h1>NAKATOMI PLAZA</h1>
<div class="sub">Christmas Eve · 30th Floor · Air Ducts</div>
<div id="score">Terrorists stopped: 0</div>
<div id="game"><div id="msg"></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const N = 10, TICK = 150, SIZE = 520; // cube is N cells on each side
const scoreEl = document.getElementById('score');
const msgEl = document.getElementById('msg');

// x is left/right, y is down/up, z is toward/away from you
const KEYS = {
  arrowup: [0, 0, -1], w: [0, 0, -1],
  arrowdown: [0, 0, 1], s: [0, 0, 1],
  arrowleft: [-1, 0, 0], a: [-1, 0, 0],
  arrowright: [1, 0, 0], d: [1, 0, 0],
  e: [0, 1, 0], q: [0, -1, 0],
};

let snake, dir, food, score, over, started, timer, audio;

// White noise through a low-pass filter: short and bright for a gunshot, long and dark for an explosion.
function bang(duration, cutoff, volume, delay = 0) {
  const start = audio.currentTime + delay;
  const buffer = audio.createBuffer(1, audio.sampleRate * duration, audio.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = audio.createBufferSource();
  const filter = audio.createBiquadFilter();
  const gain = audio.createGain();
  src.buffer = buffer;
  filter.frequency.value = cutoff;
  gain.gain.setValueAtTime(volume, start);
  gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
  src.connect(filter).connect(gain).connect(audio.destination);
  src.start(start);
}

// Pistol shot in an office tower: sharp crack, low body thump, then two echoes off the walls.
function pistol() {
  bang(0.05, 8000, 1);
  const now = audio.currentTime;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.frequency.setValueAtTime(160, now);
  osc.frequency.exponentialRampToValueAtTime(45, now + 0.15);
  gain.gain.setValueAtTime(0.7, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
  osc.connect(gain).connect(audio.destination);
  osc.start(now);
  osc.stop(now + 0.15);
  bang(0.2, 2000, 0.3, 0.09);
  bang(0.3, 1000, 0.15, 0.2);
}

// Opening phrase of Beethoven's Ode to Joy (public domain), the film's recurring theme: [Hz, beats].
const ODE_TO_JOY = [[330, 1], [330, 1], [349, 1], [392, 1], [392, 1], [349, 1], [330, 1], [294, 1],
  [262, 1], [262, 1], [294, 1], [330, 1], [330, 1.5], [294, 0.5], [294, 2]];

// Falling whistle for Hans: pitch slides down as he drops, fading in and out.
function whistle() {
  const now = audio.currentTime;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.frequency.setValueAtTime(1400, now);
  osc.frequency.exponentialRampToValueAtTime(250, now + 4);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.06, now + 0.5);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 4);
  osc.connect(gain).connect(audio.destination);
  osc.start(now);
  osc.stop(now + 4);
}

function playOdeToJoy() {
  let time = audio.currentTime;
  ODE_TO_JOY.forEach(([freq, beats]) => {
    const len = beats * 0.2;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + len);
    osc.connect(gain).connect(audio.destination);
    osc.start(time);
    osc.stop(time + len);
    time += len;
  });
}

function placeFood() {
  const r = () => Math.floor(Math.random() * N);
  do {
    food = { x: r(), y: r(), z: r() };
  } while (snake.some(s => s.x === food.x && s.y === food.y && s.z === food.z));
}

function reset() {
  snake = [{ x: 5, y: 5, z: 5 }, { x: 4, y: 5, z: 5 }, { x: 3, y: 5, z: 5 }];
  dir = [1, 0, 0];
  score = 0;
  over = false;
  started = false;
  scoreEl.textContent = 'Terrorists stopped: 0';
  msgEl.innerHTML = 'WASD or arrows to crawl<br>E up · Q down';
  placeFood();
}

function tick() {
  const head = { x: snake[0].x + dir[0], y: snake[0].y + dir[1], z: snake[0].z + dir[2] };
  const hitWall = [head.x, head.y, head.z].some(v => v < 0 || v >= N);
  // The tail moves out of the way this tick, so it isn't a collision.
  const hitSelf = snake.slice(0, -1).some(s => s.x === head.x && s.y === head.y && s.z === head.z);
  if (hitWall || hitSelf) {
    over = true;
    clearInterval(timer);
    bang(1.5, 300, 0.8);
    msgEl.innerHTML = '<b>YIPPEE-KI-YAY</b>Press Space or Enter to try again';
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y && head.z === food.z) {
    score++;
    scoreEl.textContent = 'Terrorists stopped: ' + score;
    pistol();
    placeFood();
  } else {
    snake.pop();
  }
}

// 3D scene: a camera looking into the cube from the front-right corner, above it
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(SIZE, SIZE);
document.getElementById('game').prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(9, 10, 17);
camera.lookAt(0, 0, 0);
scene.add(new THREE.AmbientLight(0xffffff, 1));
const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(5, 10, 7);
scene.add(sun);

// The cube's outline, and a grid on its floor
scene.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(N, N, N)), new THREE.LineBasicMaterial({ color: 0x1fd65f })));
const floor = new THREE.GridHelper(N, N, 0x34405a, 0x34405a);
floor.position.y = -N / 2;
scene.add(floor);

// Centre of a cell in scene units (the cube is centred on 0, 0, 0)
const at = c => new THREE.Vector3(c.x - N / 2 + 0.5, c.y - N / 2 + 0.5, c.z - N / 2 + 0.5);

// Detonator: black box with a red light on top
const detonator = new THREE.Group();
detonator.add(new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.5, 0.7), new THREE.MeshStandardMaterial({ color: 0x2b2b2b })));
const bulbMat = new THREE.MeshStandardMaterial({ color: 0x600000, emissive: 0xff2b2b });
const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.15), bulbMat);
bulb.position.y = 0.3;
detonator.add(bulb);
scene.add(detonator);

// One block per snake cell: McClane's head first, then air duct
const segGeo = new THREE.BoxGeometry(0.85, 0.85, 0.85);
const ductMat = new THREE.MeshStandardMaterial({ color: 0x8d96a3, metalness: 0.5, roughness: 0.4 });
const headMat = new THREE.MeshStandardMaterial({ color: 0xd9a066 });
const segments = [];

function draw(now) {
  while (segments.length < snake.length) {
    const m = new THREE.Mesh(segGeo, ductMat);
    segments.push(m);
    scene.add(m);
  }
  while (segments.length > snake.length) scene.remove(segments.pop());
  segments.forEach((m, i) => {
    m.position.copy(at(snake[i]));
    m.material = i === 0 ? headMat : ductMat;
  });
  detonator.position.copy(at(food));
  bulbMat.emissiveIntensity = now % 500 < 250 ? 2 : 0;
  renderer.render(scene, camera);
}

document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if (!audio) audio = new AudioContext();
  if (over) {
    if (key === ' ' || key === 'enter') reset();
    return;
  }
  const d = KEYS[key];
  if (!d) return;
  e.preventDefault();
  // A real turn: not the current direction, and not straight back into it.
  const same = (a, b) => a.every((v, i) => v === b[i]);
  const turning = !same(d, dir) && !same(d, dir.map(v => -v));
  if (turning) dir = d;
  // Move right away instead of waiting for the next tick, then restart the beat from now.
  if (!started || turning) {
    if (!started) playOdeToJoy();
    started = true;
    msgEl.innerHTML = '';
    clearInterval(timer);
    tick();
    if (!over) timer = setInterval(tick, TICK);
  }
});

// Background: night LA skyline, the tower with a fire on one floor, and falling snow
const sky = document.getElementById('sky');
const sctx = sky.getContext('2d');
let buildings, tower, flakes;
let hans = null, nextHans = 8000; // the falling figure, and when (in ms since page load) he next drops

function makeBuilding(x, w, h, color, litChance) {
  const top = sky.height - h, windows = [];
  for (let wy = top + 10; wy < sky.height - 10; wy += 14) {
    for (let wx = x + 6; wx < x + w - 8; wx += 11) {
      if (Math.random() < litChance) windows.push([wx, wy]);
    }
  }
  return { x, top, w, h, color, windows };
}

function buildScenery() {
  sky.width = innerWidth;
  sky.height = innerHeight;
  buildings = [];
  for (let x = -10; x < sky.width; ) {
    const w = 40 + Math.random() * 60;
    buildings.push(makeBuilding(x, w, 80 + Math.random() * sky.height * 0.35, '#0d1322', 0.2));
    x += w + 3;
  }
  tower = makeBuilding(sky.width * 0.82 - 60, 120, sky.height * 0.8, '#151c2e', 0.45);
  buildings.push(tower);
  // Enough flakes to fill any window; z is depth, so near flakes are bigger, brighter and faster.
  flakes = Array.from({ length: Math.round(sky.width * sky.height / 3000) }, () => {
    const z = 0.2 + Math.random() * 0.8;
    return { x: Math.random() * sky.width, y: Math.random() * sky.height, r: 1 + z * 3, v: 0.3 + z * 1.5, alpha: 0.3 + z * 0.6 };
  });
}

function drawScenery(now) {
  const gradient = sctx.createLinearGradient(0, 0, 0, sky.height);
  gradient.addColorStop(0, '#05070d');
  gradient.addColorStop(1, '#1d2a44');
  sctx.fillStyle = gradient;
  sctx.fillRect(0, 0, sky.width, sky.height);

  buildings.forEach(b => {
    sctx.fillStyle = b.color;
    sctx.fillRect(b.x, b.top, b.w, b.h);
    sctx.fillStyle = '#e8c870';
    b.windows.forEach(([x, y]) => sctx.fillRect(x, y, 5, 7));
  });

  // Antenna on the tower, and a flickering fire a few floors from the top
  sctx.fillStyle = '#151c2e';
  sctx.fillRect(tower.x + 58, tower.top - 30, 4, 30);
  sctx.fillStyle = sctx.shadowColor = '#ff6a1a';
  sctx.shadowBlur = 20 + 10 * Math.sin(now / 90);
  sctx.fillRect(tower.x + 4, tower.top + 52, tower.w - 8, 10);
  sctx.shadowBlur = 0;

  // Now and then, Hans Gruber falls in slow motion from the burning floor
  if (!hans && now > nextHans) {
    hans = { x: tower.x + tower.w / 2, y: tower.top + 57, vx: (Math.random() - 0.5) * 0.4, vy: 0, angle: 0 };
    if (audio) whistle();
  }
  if (hans) {
    hans.vy = Math.min(hans.vy + 0.015, 1.6);
    hans.x += hans.vx;
    hans.y += hans.vy;
    hans.angle += 0.012;
    const flail = Math.sin(now / 120);
    sctx.save();
    sctx.translate(hans.x, hans.y);
    sctx.rotate(hans.angle);
    sctx.scale(1.5, 1.5);
    sctx.shadowColor = '#ff6a1a'; // lit from above by the fire
    sctx.shadowBlur = 8;
    // Flailing arms and legs
    sctx.strokeStyle = '#3a3a44';
    sctx.lineWidth = 3;
    sctx.lineCap = 'round';
    sctx.beginPath();
    sctx.moveTo(0, -4);
    sctx.lineTo(-9, -10 + flail * 5);
    sctx.moveTo(0, -4);
    sctx.lineTo(9, -10 - flail * 5);
    sctx.moveTo(0, 5);
    sctx.lineTo(-4, 15 + flail * 3);
    sctx.moveTo(0, 5);
    sctx.lineTo(4, 15 - flail * 3);
    sctx.stroke();
    // Dark suit, white shirt, head
    sctx.fillStyle = '#3a3a44';
    sctx.fillRect(-4, -6, 8, 12);
    sctx.fillStyle = '#eee';
    sctx.fillRect(-1, -6, 2, 7);
    sctx.fillStyle = '#d9a066';
    sctx.beginPath();
    sctx.arc(0, -10, 3.5, 0, Math.PI * 2);
    sctx.fill();
    sctx.restore();
    if (hans.y > sky.height + 30) {
      hans = null;
      nextHans = now + 15000 + Math.random() * 25000;
    }
  }

  sctx.fillStyle = '#fff';
  flakes.forEach(f => {
    f.y += f.v;
    f.x += Math.sin(f.y / 40) * f.v * 0.4;
    if (f.y > sky.height) f.y = -5;
    sctx.globalAlpha = f.alpha;
    sctx.beginPath();
    sctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    sctx.fill();
  });
  sctx.globalAlpha = 1;
}

addEventListener('resize', buildScenery);

function frame(now) {
  drawScenery(now);
  draw(now);
  requestAnimationFrame(frame);
}

buildScenery();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
