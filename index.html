<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snake</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111; color: #eee; font-family: system-ui, sans-serif; }
  #score { font-size: 24px; margin-bottom: 12px; }
  canvas { border: 2px solid #444; }
</style>
</head>
<body>
<div id="score">Score: 0</div>
<canvas id="game" width="400" height="400"></canvas>
<script>
const GRID = 20, CELL = 20;
const ctx = document.getElementById('game').getContext('2d');
const scoreEl = document.getElementById('score');

const KEYS = {
  arrowup: [0, -1], w: [0, -1],
  arrowdown: [0, 1], s: [0, 1],
  arrowleft: [-1, 0], a: [-1, 0],
  arrowright: [1, 0], d: [1, 0],
};

let snake, dir, nextDir, food, score, over, started, timer, audio;

function beep(freq, duration) {
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.2, audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + duration);
  osc.connect(gain).connect(audio.destination);
  osc.start();
  osc.stop(audio.currentTime + duration);
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = nextDir = [1, 0];
  score = 0;
  over = false;
  started = false;
  scoreEl.textContent = 'Score: 0';
  placeFood();
  draw();
}

function tick() {
  dir = nextDir;
  const head = { x: snake[0].x + dir[0], y: snake[0].y + dir[1] };
  const hitWall = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
  // The tail moves out of the way this tick, so it isn't a collision.
  const hitSelf = snake.slice(0, -1).some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) {
    over = true;
    clearInterval(timer);
    beep(110, 0.6);
    draw();
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = 'Score: ' + score;
    beep(880, 0.1);
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#1b1b1b';
  ctx.fillRect(0, 0, 400, 400);
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(food.x * CELL + 1, food.y * CELL + 1, CELL - 2, CELL - 2);
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#7dff7a' : '#2ecc71';
    ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
  });
  ctx.fillStyle = '#eee';
  ctx.textAlign = 'center';
  ctx.font = '20px system-ui, sans-serif';
  if (over) {
    ctx.fillText('Game over — press Space or Enter', 200, 200);
  } else if (!started) {
    ctx.fillText('Press an arrow key or WASD to start', 200, 160);
  }
}

document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if (!audio) audio = new AudioContext();
  if (over) {
    if (key === ' ' || key === 'enter') reset();
    return;
  }
  const d = KEYS[key];
  if (!d) return;
  e.preventDefault();
  // Ignore a turn straight back into the direction the snake last moved.
  if (d[0] !== -dir[0] || d[1] !== -dir[1]) nextDir = d;
  if (!started) {
    started = true;
    timer = setInterval(tick, 120);
  }
});

reset();
</script>
</body>
</html>
