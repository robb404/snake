<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nakatomi Snake</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at top, #1d2a44, #05070d 70%); color: #eee; font-family: system-ui, sans-serif; }
  h1 { margin: 0; font-family: Impact, 'Arial Narrow Bold', sans-serif; font-size: 48px; letter-spacing: 4px; color: #f0f0f0; text-shadow: 0 0 12px #ff3b1f, 3px 3px 0 #8a0000; }
  .sub { margin: 4px 0 14px; color: #c9a227; letter-spacing: 3px; text-transform: uppercase; font-size: 13px; }
  #score { font-family: Impact, sans-serif; font-size: 22px; letter-spacing: 1px; margin-bottom: 10px; color: #ffd24a; }
  canvas { display: block; }
  #sky { position: fixed; inset: 0; z-index: -1; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<h1>NAKATOMI PLAZA</h1>
<div class="sub">Christmas Eve · 30th Floor · Air Ducts</div>
<div id="score">Terrorists stopped: 0</div>
<canvas id="game" width="440" height="440"></canvas>
<script>
const GRID = 20, CELL = 20, TICK = 120;
const PAD = 20; // room around the board for the Christmas lights
const LIGHT_COLORS = ['#ff2b2b', '#1fd65f', '#ffd24a', '#3aa0ff'];
const ctx = document.getElementById('game').getContext('2d');
const scoreEl = document.getElementById('score');

const KEYS = {
  arrowup: [0, -1], w: [0, -1],
  arrowdown: [0, 1], s: [0, 1],
  arrowleft: [-1, 0], a: [-1, 0],
  arrowright: [1, 0], d: [1, 0],
};

let snake, dir, food, score, over, started, timer, audio;
let prev, lastTick, particles, shake, flash; // animation state

function spawn(cell, count, colors, speed) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2, v = Math.random() * speed;
    particles.push({ x: cell.x * CELL + 10, y: cell.y * CELL + 10, vx: Math.cos(angle) * v, vy: Math.sin(angle) * v, life: 1, color: colors[i % colors.length] });
  }
}

// White noise through a low-pass filter: short and bright for a gunshot, long and dark for an explosion.
function bang(duration, cutoff, volume, delay = 0) {
  const start = audio.currentTime + delay;
  const buffer = audio.createBuffer(1, audio.sampleRate * duration, audio.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = audio.createBufferSource();
  const filter = audio.createBiquadFilter();
  const gain = audio.createGain();
  src.buffer = buffer;
  filter.frequency.value = cutoff;
  gain.gain.setValueAtTime(volume, start);
  gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
  src.connect(filter).connect(gain).connect(audio.destination);
  src.start(start);
}

// Pistol shot in an office tower: sharp crack, low body thump, then two echoes off the walls.
function pistol() {
  bang(0.05, 8000, 1);
  const now = audio.currentTime;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.frequency.setValueAtTime(160, now);
  osc.frequency.exponentialRampToValueAtTime(45, now + 0.15);
  gain.gain.setValueAtTime(0.7, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
  osc.connect(gain).connect(audio.destination);
  osc.start(now);
  osc.stop(now + 0.15);
  bang(0.2, 2000, 0.3, 0.09);
  bang(0.3, 1000, 0.15, 0.2);
}

// Opening phrase of Beethoven's Ode to Joy (public domain), the film's recurring theme: [Hz, beats].
const ODE_TO_JOY = [[330, 1], [330, 1], [349, 1], [392, 1], [392, 1], [349, 1], [330, 1], [294, 1],
  [262, 1], [262, 1], [294, 1], [330, 1], [330, 1.5], [294, 0.5], [294, 2]];

function playOdeToJoy() {
  let time = audio.currentTime;
  ODE_TO_JOY.forEach(([freq, beats]) => {
    const len = beats * 0.2;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + len);
    osc.connect(gain).connect(audio.destination);
    osc.start(time);
    osc.stop(time + len);
    time += len;
  });
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = [1, 0];
  score = 0;
  over = false;
  started = false;
  scoreEl.textContent = 'Terrorists stopped: 0';
  placeFood();
  prev = snake;
  lastTick = performance.now();
  particles = [];
  shake = flash = 0;
}

function tick() {
  prev = snake.slice();
  lastTick = performance.now();
  const head = { x: snake[0].x + dir[0], y: snake[0].y + dir[1] };
  const hitWall = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
  // The tail moves out of the way this tick, so it isn't a collision.
  const hitSelf = snake.slice(0, -1).some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) {
    over = true;
    clearInterval(timer);
    bang(1.5, 300, 0.8);
    spawn(snake[0], 60, ['#ff9a1f', '#ff3b1f', '#ffd24a', '#777'], 5);
    shake = 14;
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = 'Terrorists stopped: ' + score;
    pistol();
    spawn(food, 16, ['#fff3b0', '#ffd24a'], 3);
    flash = 1;
    placeFood();
  } else {
    snake.pop();
  }
}

function draw(now) {
  ctx.fillStyle = '#0b0e15';
  ctx.fillRect(0, 0, 440, 440);

  // Christmas lights strung around the board
  ctx.strokeStyle = '#1d4a2a';
  ctx.lineWidth = 2;
  ctx.strokeRect(10, 10, 420, 420);
  for (let p = 10; p < 430; p += 20) {
    [[p, 10], [430, p], [440 - p, 430], [10, 440 - p]].forEach(([x, y], side) => {
      ctx.fillStyle = ctx.shadowColor = LIGHT_COLORS[((p - 10) / 20 + side) % LIGHT_COLORS.length];
      ctx.shadowBlur = 7 + 6 * Math.sin(now / 250 + p / 20 + side * 5); // twinkle
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fill();
    });
  }
  ctx.shadowBlur = 0;

  ctx.save();
  ctx.translate(PAD + (Math.random() - 0.5) * shake, PAD + (Math.random() - 0.5) * shake);
  shake *= 0.9;

  // Office carpet tiles
  for (let x = 0; x < GRID; x++) {
    for (let y = 0; y < GRID; y++) {
      ctx.fillStyle = (x + y) % 2 ? '#1a1f2b' : '#161a24';
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }
  }

  // Detonator: black box, wires, glowing red light
  const fx = food.x * CELL, fy = food.y * CELL;
  ctx.fillStyle = '#2b2b2b';
  ctx.fillRect(fx + 3, fy + 6, 14, 11);
  ctx.fillStyle = '#454545';
  ctx.fillRect(fx + 3, fy + 6, 14, 2);
  ctx.fillStyle = '#c9a227';
  ctx.fillRect(fx + 5, fy + 2, 2, 5);
  ctx.fillStyle = '#3aa0ff';
  ctx.fillRect(fx + 13, fy + 2, 2, 5);
  const lit = now % 500 < 250;
  ctx.fillStyle = ctx.shadowColor = lit ? '#ff2b2b' : '#600';
  ctx.shadowBlur = lit ? 14 : 0;
  ctx.beginPath();
  ctx.arc(fx + 10, fy + 12, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Between ticks, each segment glides from where it was (prev) to where it is now.
  const centers = snake.map(s => [s.x * CELL + 10, s.y * CELL + 10]);
  const t = Math.min((now - lastTick) / TICK, 1);
  const glide = i => {
    const from = prev[i] || snake[i];
    return [centers[i][0] + (from.x - snake[i].x) * CELL * (1 - t), centers[i][1] + (from.y - snake[i].y) * CELL * (1 - t)];
  };

  // Air duct: one continuous pipe (dark edge, body, highlight). It runs from McClane
  // through the cells he has crawled to a sliding tail end, so corners stay square.
  const path = [glide(0), ...centers.slice(1), glide(snake.length - 1)];
  ctx.lineCap = ctx.lineJoin = 'round';
  [[16, '#4e5560'], [12, '#8d96a3'], [3, '#c9d0d8']].forEach(([width, color]) => {
    ctx.lineWidth = width;
    ctx.strokeStyle = color;
    ctx.beginPath();
    path.forEach(([x, y]) => ctx.lineTo(x, y));
    ctx.stroke();
  });
  // Seams where duct sections join (the one nearest the head is under McClane)
  ctx.strokeStyle = '#3a4048';
  ctx.lineWidth = 2;
  for (let i = 2; i < centers.length; i++) {
    const [ax, ay] = centers[i - 1], [bx, by] = centers[i];
    const x = (ax + bx) / 2, y = (ay + by) / 2;
    // The seam runs across the pipe: horizontal on a vertical run, vertical on a horizontal one
    const [dx, dy] = ax === bx ? [8, 0] : [0, 8];
    ctx.beginPath();
    ctx.moveTo(x - dx, y - dy);
    ctx.lineTo(x + dx, y + dy);
    ctx.stroke();
  }

  // McClane from above, facing the way he's crawling: tank top, arms reaching forward, head
  ctx.save();
  ctx.translate(path[0][0], path[0][1]);
  ctx.rotate(Math.atan2(dir[1], dir[0]));
  ctx.fillStyle = '#d9a066';
  ctx.fillRect(-3, -9, 11, 3);
  ctx.fillRect(-3, 6, 11, 3);
  ctx.fillStyle = '#f2f2f2';
  ctx.fillRect(-10, -7, 9, 14);
  ctx.fillStyle = '#d9a066';
  ctx.beginPath();
  ctx.arc(3, 0, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#4a2f1a';
  ctx.beginPath();
  ctx.arc(3, 0, 5, Math.PI / 2, Math.PI * 1.5);
  ctx.fill();
  ctx.restore();

  // Muzzle flash where the detonator was grabbed
  if (flash > 0) {
    ctx.fillStyle = `rgba(255, 235, 160, ${flash})`;
    ctx.beginPath();
    ctx.arc(centers[0][0], centers[0][1], 8 + 16 * (1 - flash), 0, Math.PI * 2);
    ctx.fill();
    flash -= 0.12;
  }

  // Sparks and debris
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.08;
    p.life -= 0.02;
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
  });
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center';
  if (over) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(0, 140, 400, 110);
    ctx.fillStyle = '#ff3b1f';
    ctx.font = '40px Impact, sans-serif';
    ctx.fillText('YIPPEE-KI-YAY', 200, 192);
    ctx.fillStyle = '#eee';
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillText('Press Space or Enter to try again', 200, 228);
  } else if (!started) {
    ctx.fillStyle = '#eee';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('Arrow keys or WASD to start crawling', 200, 160);
  }
  ctx.restore();
}

document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if (!audio) audio = new AudioContext();
  if (over) {
    if (key === ' ' || key === 'enter') reset();
    return;
  }
  const d = KEYS[key];
  if (!d) return;
  e.preventDefault();
  // A real turn: not the current direction, and not straight back into it.
  const turning = (d[0] !== dir[0] || d[1] !== dir[1]) && (d[0] !== -dir[0] || d[1] !== -dir[1]);
  if (turning) dir = d;
  // Move right away instead of waiting for the next tick, then restart the beat from now.
  if (!started || turning) {
    if (!started) playOdeToJoy();
    started = true;
    clearInterval(timer);
    tick();
    if (!over) timer = setInterval(tick, TICK);
  }
});

// Background: night LA skyline, the tower with a fire on one floor, and falling snow
const sky = document.getElementById('sky');
const sctx = sky.getContext('2d');
let buildings, tower, flakes;

function makeBuilding(x, w, h, color, litChance) {
  const top = sky.height - h, windows = [];
  for (let wy = top + 10; wy < sky.height - 10; wy += 14) {
    for (let wx = x + 6; wx < x + w - 8; wx += 11) {
      if (Math.random() < litChance) windows.push([wx, wy]);
    }
  }
  return { x, top, w, h, color, windows };
}

function buildScenery() {
  sky.width = innerWidth;
  sky.height = innerHeight;
  buildings = [];
  for (let x = -10; x < sky.width; ) {
    const w = 40 + Math.random() * 60;
    buildings.push(makeBuilding(x, w, 80 + Math.random() * sky.height * 0.35, '#0d1322', 0.2));
    x += w + 3;
  }
  tower = makeBuilding(sky.width * 0.82 - 60, 120, sky.height * 0.8, '#151c2e', 0.45);
  buildings.push(tower);
  // Enough flakes to fill any window; z is depth, so near flakes are bigger, brighter and faster.
  flakes = Array.from({ length: Math.round(sky.width * sky.height / 3000) }, () => {
    const z = 0.2 + Math.random() * 0.8;
    return { x: Math.random() * sky.width, y: Math.random() * sky.height, r: 1 + z * 3, v: 0.3 + z * 1.5, alpha: 0.3 + z * 0.6 };
  });
}

function drawScenery(now) {
  const gradient = sctx.createLinearGradient(0, 0, 0, sky.height);
  gradient.addColorStop(0, '#05070d');
  gradient.addColorStop(1, '#1d2a44');
  sctx.fillStyle = gradient;
  sctx.fillRect(0, 0, sky.width, sky.height);

  buildings.forEach(b => {
    sctx.fillStyle = b.color;
    sctx.fillRect(b.x, b.top, b.w, b.h);
    sctx.fillStyle = '#e8c870';
    b.windows.forEach(([x, y]) => sctx.fillRect(x, y, 5, 7));
  });

  // Antenna on the tower, and a flickering fire a few floors from the top
  sctx.fillStyle = '#151c2e';
  sctx.fillRect(tower.x + 58, tower.top - 30, 4, 30);
  sctx.fillStyle = sctx.shadowColor = '#ff6a1a';
  sctx.shadowBlur = 20 + 10 * Math.sin(now / 90);
  sctx.fillRect(tower.x + 4, tower.top + 52, tower.w - 8, 10);
  sctx.shadowBlur = 0;

  sctx.fillStyle = '#fff';
  flakes.forEach(f => {
    f.y += f.v;
    f.x += Math.sin(f.y / 40) * f.v * 0.4;
    if (f.y > sky.height) f.y = -5;
    sctx.globalAlpha = f.alpha;
    sctx.beginPath();
    sctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    sctx.fill();
  });
  sctx.globalAlpha = 1;
}

addEventListener('resize', buildScenery);

function frame(now) {
  drawScenery(now);
  draw(now);
  requestAnimationFrame(frame);
}

buildScenery();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
